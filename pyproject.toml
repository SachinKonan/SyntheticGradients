[project]
name = "sg"
version = "0.0.1"
description = "Learning the backward pass for test-time adaptation"
requires-python = ">=3.11"
dependencies = ["numpy", "array-record", "jax", "safetensors", "pillow"]

[dependency-groups]
prep = ["h5py"]
dev = ["pytest", "h5py", "torch", "torchvision", "timm"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sg"]
